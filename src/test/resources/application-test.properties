# Datasource is supplied at runtime by the Testcontainers Postgres instance
# declared in AbstractPostgresTest (@ServiceConnection), so no URL here.

# Tests run the real Flyway migrations against the real engine, then Hibernate
# validates the mapping against that schema - exactly as production does.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

lendo.loan-policy.min-amount=1000.00
lendo.loan-policy.max-amount=5000000.00
lendo.loan-policy.min-loan-terms=1
lendo.loan-policy.max-loan-terms=360
lendo.loan-policy.application-expiration=PT24H
