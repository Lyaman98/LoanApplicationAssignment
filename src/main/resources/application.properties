spring.application.name=LoanApplicationAssignment

# Data source
# Local defaults; every deployment overrides these with the standard
# SPRING_DATASOURCE_* environment variables (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://localhost:5432/lendo
spring.datasource.username=lendo
spring.datasource.password=lendo

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Business policy for loan applications
lendo.loan-policy.min-amount=1000.00
lendo.loan-policy.max-amount=5000000.00
lendo.loan-policy.min-loan-terms=1
lendo.loan-policy.max-loan-terms=360
lendo.loan-policy.application-expiration=PT24H
