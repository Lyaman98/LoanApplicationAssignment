services:
  postgres:
    image: postgres:16-alpine
    container_name: lendo-postgres
    environment:
      POSTGRES_DB: lendo
      POSTGRES_USER: lendo
      POSTGRES_PASSWORD: lendo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lendo -d lendo" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lendo-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lendo
      SPRING_DATASOURCE_USERNAME: lendo
      SPRING_DATASOURCE_PASSWORD: lendo
    ports:
      - "8080:8080"

volumes:
  postgres-data:
